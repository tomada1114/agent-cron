[package]
name = "agent-cron-platform"
description = "Adapters that implement agent-cron-core's ports against the real OS and filesystem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
openrouter = ["dep:dotenvy", "dep:ureq"]

[dependencies]
agent-cron-core = { workspace = true }
dotenvy = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
agent-cron-test-support = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
